apiVersion: 1

groups:
  - orgId: 1
    name: Uptime
    folder: Parish API
    interval: 1m
    rules:
      - uid: api-down-alert
        title: API Backend Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="fastapi"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  reducer:
                    type: last
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "FastAPI backend is unreachable"
          description: "The Prometheus scrape target backend:8000 has been down for more than 2 minutes."
        labels:
          severity: critical
