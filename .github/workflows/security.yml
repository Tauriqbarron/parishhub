name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t parish-backend:scan ./backend

      - name: Build frontend image
        run: docker build -t parish-frontend:scan ./frontend

      - name: Run Trivy on backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'parish-backend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'

      - name: Run Trivy on frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'parish-frontend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          trivyignores: 'frontend/.trivyignore'
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'

      - name: Generate SARIF report (backend)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'parish-backend:scan'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          scanners: 'vuln'
          exit-code: '0'
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'

      - name: Generate SARIF report (frontend)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'parish-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          scanners: 'vuln'
          exit-code: '0'
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'

      - name: Upload backend Trivy results
        if: always() && hashFiles('trivy-backend.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'

      - name: Upload frontend Trivy results
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'
