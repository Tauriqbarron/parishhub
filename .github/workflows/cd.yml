name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux, parish-prod]
    if: github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure directories exist
        run: |
          mkdir -p /var/log/parish-deploy /var/backups/parish-db 2>/dev/null || \
          sudo mkdir -p /var/log/parish-deploy /var/backups/parish-db
          chown "$(whoami)" /var/log/parish-deploy /var/backups/parish-db 2>/dev/null || \
          sudo chown "$(whoami)" /var/log/parish-deploy /var/backups/parish-db

      - name: Copy .env file
        run: cp /home/deploy/parish-database/.env .env

      - name: Deploy
        run: bash scripts/deploy.sh

      - name: Verify deployment
        run: |
          echo "Deployed commit: $(git rev-parse --short HEAD)"
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8000/api/health; then
              echo ""
              echo "Deployment verified successfully."
              exit 0
            fi
            echo "Health check attempt ${i}/12 failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 12 attempts"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 8);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed: ${sha}`,
              body: `Deployment failed for commit \`${context.sha}\`.\n\n**Run:** ${runUrl}\n\nAutomatic rollback was attempted. Please verify the server state.`,
              labels: ['deploy-failure']
            });
